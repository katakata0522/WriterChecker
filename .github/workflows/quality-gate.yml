name: quality-gate

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run regression guards
        run: npm run test:regression

      - name: Build minified css
        run: npm run build:css

  browser-smoke:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Run desktop and mobile browser checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 >browser-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium was not found on the runner.' >&2
            exit 1
          fi

          run_check() {
            local mode="$1"
            local size="$2"
            local profile="/tmp/writer-checker-${mode}"
            rm -rf "$profile"
            "$CHROME_BIN" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --run-all-compositor-stages-before-draw \
              --host-resolver-rules='MAP www.googletagmanager.com 127.0.0.1' \
              --user-data-dir="$profile" \
              --window-size="$size" \
              --virtual-time-budget=9000 \
              --screenshot="browser-artifacts/${mode}.png" \
              --dump-dom \
              "http://127.0.0.1:4173/tests/browser-smoke.html?mode=${mode}" \
              >"browser-artifacts/${mode}.html" \
              2>"browser-artifacts/${mode}.log"
            grep -Eq '<html[^>]*data-status="pass"' "browser-artifacts/${mode}.html"
          }

          run_check desktop 1440,1000
          run_check mobile 500,844

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-checker-browser-smoke
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
