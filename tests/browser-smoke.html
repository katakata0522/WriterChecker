<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Writer Checker Browser Smoke</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e2e8f0; }
        body.mobile { display: flex; justify-content: center; align-items: flex-start; }
        #app { width: 100vw; height: 100vh; border: 0; display: block; background: #f8fafc; }
        body.mobile #app { width: 390px; height: 844px; max-width: 100vw; }
        #status { position: fixed; top: 8px; right: 8px; z-index: 9999; padding: 6px 10px; border-radius: 999px; background: #334155; color: #fff; font: 700 12px/1.2 sans-serif; box-shadow: 0 2px 8px rgba(15,23,42,.25); }
        html[data-status="pass"] #status { background: #047857; }
        html[data-status="fail"] #status { background: #b91c1c; }
        #details { position: fixed; inset: auto 8px 8px 8px; z-index: 9998; max-height: 38vh; overflow: auto; margin: 0; padding: 10px; border-radius: 8px; background: rgba(15,23,42,.94); color: #fff; font: 12px/1.5 monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <iframe id="app" title="Writer Checker"></iframe>
    <div id="status">確認中</div>
    <pre id="details" hidden></pre>
    <script>
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const mode = new URLSearchParams(location.search).get('mode') || 'desktop';
        const checks = [];
        if (mode === 'mobile') document.body.classList.add('mobile');

        function verify(name, condition, detail = '') {
            checks.push({ name, pass: Boolean(condition), detail });
            if (!condition) throw new Error(`${name}${detail ? `: ${detail}` : ''}`);
        }

        function finish(status, error = null) {
            document.documentElement.dataset.status = status;
            document.getElementById('status').textContent = status === 'pass' ? `${mode}: PASS` : `${mode}: FAIL`;
            const details = document.getElementById('details');
            details.hidden = status === 'pass';
            details.textContent = [
                ...checks.map((check) => `${check.pass ? 'PASS' : 'FAIL'} ${check.name}${check.detail ? ` (${check.detail})` : ''}`),
                error ? `ERROR ${error.stack || error.message || error}` : ''
            ].filter(Boolean).join('\n');
        }

        async function run() {
            const iframe = document.getElementById('app');
            const loaded = new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('アプリの読み込みがタイムアウトしました')), 10000);
                iframe.addEventListener('load', () => {
                    clearTimeout(timeout);
                    resolve();
                }, { once: true });
            });
            iframe.src = '../index.html?browser-smoke=1';
            await loaded;
            await wait(1200);

            const win = iframe.contentWindow;
            const doc = iframe.contentDocument;
            verify('本文が描画される', doc.body?.innerText.trim().length > 100);
            verify('入力欄が存在する', Boolean(doc.getElementById('sourceText')));
            verify('結果欄が存在する', Boolean(doc.getElementById('resultOutput')));
            verify('主要操作が存在する', Boolean(doc.getElementById('replaceBtn') && doc.getElementById('copyBtn')));
            verify('エラーオーバーレイがない', !doc.querySelector('[data-nextjs-dialog], .vite-error-overlay, #webpack-dev-server-client-overlay'));

            const source = doc.getElementById('sourceText');
            const original = 'ＷＥＢ上で出来る。URLはhttps://example.com/ＷＥＢです。メールはuser@example.com。';
            source.value = original;
            source.dispatchEvent(new win.Event('input', { bubbles: true }));
            await wait(900);

            const highlights = [...doc.querySelectorAll('.highlight')];
            verify('想定した2件を検出する', highlights.length === 2, `actual=${highlights.length}`);
            verify('URL内を誤検出しない', highlights.every((item) => !item.textContent.includes('example.com')));
            verify('指摘をルール単位で集約する', doc.querySelectorAll('.issue-group-card').length === 2);

            doc.getElementById('replaceBtn').click();
            await wait(500);
            verify('本文へ安全に反映できる', source.value.includes('Web上でできる'));
            verify('URL内の表記を維持する', source.value.includes('https://example.com/ＷＥＢ'));

            doc.getElementById('undoBtn').click();
            await wait(350);
            verify('元に戻せる', source.value === original);

            doc.getElementById('sidePanelToggle').click();
            await wait(150);
            verify('設定パネルを開ける', !doc.getElementById('sidePanel').classList.contains('hidden'));
            verify('aria-expandedが同期する', doc.getElementById('sidePanelToggle').getAttribute('aria-expanded') === 'true');

            doc.getElementById('editRulesBtn').click();
            await wait(200);
            verify('ルール編集画面を開ける', !doc.getElementById('ruleModal').classList.contains('hidden'));
            verify('ルール一覧を表示する', doc.querySelectorAll('.rule-item').length > 0);
            verify('詳細設定を折りたためる', doc.querySelectorAll('.rule-item details').length > 0);
            doc.getElementById('closeModalBtn').click();

            const mobileBar = doc.querySelector('.mobile-action-bar');
            const mobileLayout = win.matchMedia('(max-width: 768px)').matches;
            const mobileBarVisible = mobileBar && win.getComputedStyle(mobileBar).display !== 'none';
            const scrollWidth = Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth);
            const viewportWidth = doc.documentElement.clientWidth;
            verify('横スクロールが発生しない', scrollWidth <= viewportWidth + 2, `${scrollWidth}/${viewportWidth}`);
            if (mode === 'mobile') {
                verify('390pxのスマートフォン幅で表示する', viewportWidth === 390, `actual=${viewportWidth}`);
                verify('スマートフォン用レイアウトが適用される', mobileLayout);
                verify('モバイル操作バーが表示される', mobileBarVisible);
            } else {
                verify('デスクトップ幅が適用される', !mobileLayout);
                verify('モバイル操作バーが非表示', !mobileBarVisible);
            }

            verify('結果件数がライブ通知される', doc.getElementById('matchCountStatus')?.getAttribute('aria-live') === 'polite');
            finish('pass');
        }

        run().catch((error) => finish('fail', error));
    </script>
</body>
</html>
