    <script type="application/ld+json">{
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "レギュレーション・チェッカー",
        "url": "https://katakatalab.com/writer-checker/",
        "description": "文章の表記ゆれや独自ルール違反を確認し、安全に修正する無料ツール",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "All",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" }
    }</script>
    <script type="application/ld+json">{
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
            {
                "@type": "Question",
                "name": "Writer Checkerは無料で使えますか？",
                "acceptedAnswer": { "@type": "Answer", "text": "はい。ルールセットの作成、文章チェック、一括修正、インポートとエクスポートを無料で利用できます。" }
            },
            {
                "@type": "Question",
                "name": "どのような文章に向いていますか？",
                "acceptedAnswer": { "@type": "Answer", "text": "ブログ記事、業務文書、メール、AI生成文など、表記ルールを統一したい文章に向いています。" }
            },
            {
                "@type": "Question",
                "name": "URLやコードの中も修正されますか？",
                "acceptedAnswer": { "@type": "Answer", "text": "既定ではURL、メールアドレス、コードを除外します。ルールごとに除外範囲を変更できます。" }
            }
        ]

<body>
    <header class="app-header">
        <div class="header-left">
            <h1><i class="fa-solid fa-check-double" aria-hidden="true"></i> Writer Checker</h1>
            <span class="badge badge-free">FREE</span>
        </div>
        <div class="header-right">
            <div class="rule-selector-container">
                <label for="ruleSetSelector" class="rule-selector-label">ルールセット</label>
                <select id="ruleSetSelector" aria-label="ルールセット"></select>
            </div>
            <button id="sidePanelToggle" class="btn btn-side-toggle" type="button" aria-label="設定を開く">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i> 設定
            </button>
        </div>
    </header>

    <div id="sidePanelOverlay" class="side-panel-overlay hidden"></div>
    <aside id="sidePanel" class="side-panel hidden" aria-label="設定">
        <div class="side-panel-header">
            <h2><i class="fa-solid fa-sliders" aria-hidden="true"></i> 設定</h2>
            <button id="sidePanelClose" class="btn-close" type="button" aria-label="設定を閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="side-panel-body">
            <section class="side-panel-section side-panel-primary-actions">
                <button id="editRulesBtn" class="btn btn-primary btn-block" type="button"><i class="fa-solid fa-gear" aria-hidden="true"></i> ルールを編集</button>
                <a href="guide/" class="btn btn-sm btn-ghost btn-block" target="_blank" rel="noopener"><i class="fa-solid fa-circle-question" aria-hidden="true"></i> 使い方ガイド</a>
                <button id="installAppBtn" class="btn btn-sm btn-outline btn-block hidden" type="button"><i class="fa-solid fa-download" aria-hidden="true"></i> アプリをインストール</button>
            </section>

            <section class="side-panel-section">
                <h3>ルールセット</h3>
                <div class="side-panel-actions">
                    <button id="addRuleSetBtn" class="btn btn-sm btn-outline" type="button"><i class="fa-solid fa-plus" aria-hidden="true"></i> 新規作成</button>
                    <button id="deleteRuleSetBtn" class="btn btn-sm btn-ghost btn-danger-icon" type="button"><i class="fa-solid fa-trash" aria-hidden="true"></i> 削除</button>
                </div>
            </section>

            <section class="side-panel-section">
                <h3>データ管理</h3>
                <div class="side-panel-actions data-actions">
                    <button id="exportRulesBtn" class="btn btn-sm btn-ghost" type="button"><i class="fa-solid fa-file-export" aria-hidden="true"></i> 書き出す</button>
                    <button id="importRulesBtn" class="btn btn-sm btn-ghost" type="button"><i class="fa-solid fa-file-import" aria-hidden="true"></i> 読み込む</button>
                    <button id="shareRulesBtn" class="btn btn-sm btn-ghost" type="button"><i class="fa-solid fa-link" aria-hidden="true"></i> 共有リンク</button>
                </div>
                <input type="file" id="importFileInput" accept=".json,application/json" class="hidden">
            </section>

            <section class="side-panel-section">
                <h3>外部エディタ連携</h3>
                <p class="side-panel-note">下のボタンをブックマークバーへドラッグすると、noteやWordPressの文章を送れます。</p>
                <a id="bookmarkletLink" class="bookmarklet-link" href="#">Writer Checkerで確認</a>
            </section>

            <section class="side-panel-section side-panel-legal">
                <a href="terms/" target="_blank" rel="noopener">利用規約</a>
                <span class="legal-divider">|</span>
                <a href="privacy/" target="_blank" rel="noopener">プライバシーポリシー</a>
            </section>
        </div>
    </aside>

    <main class="app-main">
        <section class="editor-pane">
            <div class="pane-header">
                <h2><i class="fa-solid fa-pen-nib" aria-hidden="true"></i> 文章</h2>
                <div class="pane-actions">
                    <button id="undoBtn" class="btn btn-sm btn-ghost" type="button" hidden><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> 元に戻す</button>
                    <button id="clearBtn" class="btn btn-sm btn-ghost" type="button">クリア</button>
                    <button id="pasteBtn" class="btn btn-sm btn-ghost" type="button">貼り付け</button>
                    <button id="sampleBtn" class="btn btn-sm btn-ghost" type="button"><i class="fa-solid fa-flask" aria-hidden="true"></i> サンプル</button>
                </div>
            </div>
            <textarea id="sourceText" aria-label="確認する文章" placeholder="ここに文章を貼り付けてください。テキストファイルのドラッグ＆ドロップにも対応しています。"></textarea>
            <div class="status-bar status-bar--minimal"><span id="charCount">0文字</span></div>
        </section>

        <section class="preview-pane">
            <div class="pane-header result-pane-header">
                <div class="result-title">
                    <h2><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> チェック結果 <span id="matchCount" class="badge-count badge-count--ok">0</span></h2>
                    <p id="matchCountStatus" class="result-summary" aria-live="polite">指摘なし</p>
                </div>
                <div class="pane-actions result-actions">
                    <details class="more-actions">
                        <summary class="btn btn-sm btn-ghost" aria-label="その他の操作"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i></summary>
                        <div class="more-actions-menu">
                            <button id="exportReportBtn" class="btn btn-sm btn-ghost" type="button"><i class="fa-solid fa-file-export" aria-hidden="true"></i> 検査レポートを保存</button>
                        </div>
                    </details>
                    <button id="replaceBtn" class="btn btn-sm btn-outline" type="button" title="自動修正を許可したルールだけ本文へ反映"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> 本文へ反映</button>
                    <button id="copyBtn" class="btn btn-sm btn-primary" type="button" title="自動修正可能な箇所を反映した文章をコピー"><i class="fa-solid fa-copy" aria-hidden="true"></i> 修正結果をコピー</button>
                </div>
            </div>
            <div id="resultOutput" class="result-content"><div class="placeholder-text">文章を貼り付けると、ルールに一致した箇所を表示します。</div></div>
        </section>
    </main>

    <div id="ruleModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ruleModalTitle">
        <div class="modal-content modal-content-rules">
            <div class="modal-header">
                <div>
                    <h2 id="ruleModalTitle"><i class="fa-solid fa-sliders" aria-hidden="true"></i> ルール編集</h2>
                    <p class="modal-subtitle">普段は検出語・推奨表記・重大度だけを確認し、必要な項目だけ詳細設定を開きます。</p>
                </div>
                <button id="closeModalBtn" class="btn-close" type="button" aria-label="閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
            <div class="modal-toolbar">
                <input type="search" id="ruleSearchInput" class="rule-search-input" placeholder="ルールを検索" aria-label="ルールを検索">
                <button id="regexTemplateBtn" class="btn btn-sm btn-ghost" type="button"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> 安全テンプレート</button>
                <button id="addRuleBtn" class="btn btn-sm btn-outline" type="button"><i class="fa-solid fa-plus" aria-hidden="true"></i> 追加</button>
            </div>
            <div class="modal-body rule-modal-body"><div id="rulesList" class="rules-list"></div></div>
            <div class="modal-footer modal-footer--split">
                <p class="save-state">状態: <strong id="saveStateStatus">保存済み</strong></p>
                <button id="saveRulesBtn" class="btn btn-primary" type="button">変更を保存</button>
            </div>
        </div>
    </div>

    <div id="nameModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
        <div class="modal-content modal-content-sm">
            <div class="modal-header">
                <h2 id="nameModalTitle"><i class="fa-solid fa-folder-plus" aria-hidden="true"></i> 新規ルールセット</h2>
                <button id="closeNameModalBtn" class="btn-close" type="button" aria-label="閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
            <div class="modal-body">
                <label for="newRuleSetName" class="input-label">ルールセット名</label>
                <input type="text" id="newRuleSetName" class="input-field" maxlength="120" placeholder="例: A社ブログ用">
                <p id="nameModalError" class="input-error hidden"></p>
            </div>
            <div class="modal-footer"><button id="confirmNameBtn" class="btn btn-primary" type="button">作成</button></div>
        </div>
    </div>

    <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="modal-content modal-content-sm">
            <div class="modal-header">
                <h2 id="confirmModalTitle"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> 確認</h2>
                <button id="closeConfirmModalBtn" class="btn-close" type="button" aria-label="閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
            <div class="modal-body"><p id="confirmModalMsg" class="confirm-msg"></p></div>
            <div class="modal-footer modal-footer--compact">
                <button id="confirmModalCancelBtn" class="btn btn-sm btn-ghost" type="button">キャンセル</button>
                <button id="confirmModalOkBtn" class="btn btn-sm btn-primary" type="button">実行</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <nav class="mobile-action-bar" aria-label="モバイル操作">
        <button id="mobileReplaceBtn" class="btn btn-sm btn-outline" type="button"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> 反映</button>
        <button id="mobileCopyBtn" class="btn btn-sm btn-primary" type="button"><i class="fa-solid fa-copy" aria-hidden="true"></i> コピー</button>
        <button id="mobileSettingsBtn" class="btn btn-sm btn-ghost" type="button"><i class="fa-solid fa-sliders" aria-hidden="true"></i> 設定</button>
    </nav>

    <script type="module" src="js/app.js?v=20260805a"></script>
</body>
